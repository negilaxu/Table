<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/ce9aff37fa.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- Dark Mode Toggle -->
    <div class="theme-toggle" id="theme-toggle">Dark Mode</div>

    <!-- Container -->
    <div class="container">
        <h1>Most Active Users</h1>

        <!-- Loader -->
        <div class="spinner" id="spinner">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
        </div>

        <!-- Table -->
        <table id="data-table">
            <thead>
                <tr>
                    <th class="name-column">Name<i class="fas fa-sort" id="icon-0"></i></th>
                    <th class="email-column">Email<i class="fas fa-sort" id="icon-1"></i></th>
                    <th class="username-column">Username<i class="fas fa-sort" id="icon-2"></i></th>
                    <th class="country-column">Country<i class="fas fa-sort" id="icon-3"></i></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Name Here</td>
                    <td>Email Here</td>
                    <td>Username Here</td>
                    <td>Country Here</td>
                </tr>
                <tr>
                    <td>Name Here</td>
                    <td>Email Here</td>
                    <td>Username Here</td>
                    <td>Country Here</td>
                </tr>
                <tr>
                    <td>Name Here</td>
                    <td>Email Here</td>
                    <td>Username Here</td>
                    <td>Country Here</td>
                </tr>
                <tr>
                    <td>Name Here</td>
                    <td>Email Here</td>
                    <td>Username Here</td>
                    <td>Country Here</td>
                </tr>
                <tr>
                    <td>Name Here</td>
                    <td>Email Here</td>
                    <td>Username Here</td>
                    <td>Country Here</td>
                </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination">
            <button type="button" id="prev-btn" title="Previous Page"><i class="fas fa-chevron-left"></i></button>
            <span id="page-number">1</span>
            <button type="button" id="next-btn" title="Next Page"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

</body>

</html>
